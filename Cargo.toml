[package]
name = "ender-flash"
version = "0.1.0"
edition = "2021"
description = "Streamlined Linux CLI to inspect a removable SD card and flash Ender 3 V3 SE firmware (.bin)"
license = "MIT"
readme = "README.md"
keywords = ["ender3", "firmware", "flash", "3d-printing", "creality"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
fs2 = "0.4.3"
indicatif = "0.18.6"
inquire = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"
